[package]
name = "lumatune-win"
edition.workspace = true
version.workspace = true

[dependencies]
chrono = "0.4"
lumatune-core = { path = "../lumatune-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62", features = ["Globalization_DateTimeFormatting", "UI_ViewManagement", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Imaging", "Win32_UI_Accessibility", "Win32_UI_ColorSystem", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Registry"] }
windows-collections = "0.3"
windows-core = "0.62"
windows-numerics = "0.3"
