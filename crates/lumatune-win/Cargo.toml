[package]
name = "lumatune-win"
edition.workspace = true
version.workspace = true

[dependencies]
lumatune-core = { path = "../lumatune-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_Accessibility", "Win32_UI_ColorSystem", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
